blueprint:
    name: Actions4VirtualButton
    description: "Tasterbelgung Virtueller Taster"
    domain: automation
    input:
        button_virtual:
            name: Virtual button_virtual
            description: Virtueller Taster, der von Schalter getriggert werden soll
            selector:
                entity:
                    filter:
                        - domain: input_select
        action_off:
            name: Ausschalteaktion
            description: Aktion die beim "ausschalten" durchgeführt wird
            selector:
                action:
        ListDevices2SwitchOff:
            name: GerätelisteEinschaltzustand
            description: Geräte die Überprüft werden sollen um Ausschalten durchzuführen
            selector:
                entity:
                    multiple: true
        contition_off:
            name: BedingungAuschaltaktion
            description: Bedingung die erfüllt sein muss, damit bei EInfachklick die Ausschaltaktion durchgeführt wird
            selector:
                condition:
        action_oneClick:
            name: EinfachKlickAktion
            description: Aktion die beim "Einfach Klick" durchgeführt wird
            selector:
                action:
        action_doubleClick:
            name: EinfachKlickAktion
            description: Aktion die beim "Doppel Klick" durchgeführt wird
            selector:
                action:
        action_trippleClick:
            name: EinfachKlickAktion
            description: Aktion die beim "Dreifach Klick" durchgeführt wird
            selector:
                action:
          
triggers:
  - trigger: state
    entity_id:
      - !input button_virtual
    from:
      - IDLE
conditions: []
actions:
     - choose:
        - conditions:
          - condition: state
            entity_id: !input button_virtual
            state:
              - Doppel Klick
          sequence: !input action_off
    
mode: single