blueprint:
    name: Actions4VirtualButton
    description: "Tasterbelgung Virtueller Taster"
    domain: automation
    input:
        button_virtual:
            name: Virtual button_virtual
            description: Virtueller Taster, der von Schalter getriggert werden soll
            selector:
                entity:
                    filter:
                        - domain: input_select
        entitys2SwitchOff:
            name: GerätelisteEinschaltzustand
            description: Geräte die Überprüft werden sollen um Ausschalten durchzuführen
            selector:
                entity:
                    multiple: true
        action_oneClick:
            name: EinfachKlickAktion
            description: Aktion die beim "Einfach Klick" durchgeführt wird
            selector:
                action:
        action_doubleClick:
            name: DoppelKlickAktion
            description: Aktion die beim "Doppel Klick" durchgeführt wird
            selector:
                action:
        action_trippleClick:
            name: DreifachKlickAktion
            description: Aktion die beim "Dreifach Klick" durchgeführt wird
            selector:
                action:
  
variables:
  devices_to_check: !input entitys2SwitchOff
  
triggers:
  - trigger: state
    entity_id:
      - !input button_virtual
    from:
      - IDLE
conditions: []
actions:
     - choose:
        - conditions:
          - condition: state
            entity_id: !input button_virtual
            state:
              - Einfach Klick
          sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ expand((devices_to_check))
                         | selectattr('state', 'eq', 'on')
                         | list
                         | count > 0 }}
                sequence:
                  - service: homeassistant.turn_off
                    target:
                        entity_id: !input entitys2SwitchOff
            default: !input action_oneClick
        - conditions:
          - condition: state
            entity_id: !input button_virtual
            state:
              - Doppel Klick
          sequence: !input action_doubleClick
        - conditions:
          - condition: state
            entity_id: !input button_virtual
            state:
              - Dreifach Klick
          sequence: !input action_trippleClick
    
mode: single